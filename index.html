<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>liminal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        color: #d8d4c4;
      }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      #overlay {
        position: absolute; inset: 0; z-index: 10; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; text-align: center; background: rgba(0, 0, 0, 0.74);
      }
      #overlay h1 {
        font-size: 20px; font-weight: 400; letter-spacing: 0.6em;
        text-transform: uppercase; color: #f2e9c9; text-indent: 0.6em;
      }
      #overlay p { font-size: 12.5px; line-height: 1.9; opacity: 0.65; }
      #overlay.hidden { display: none; }

      #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      #crosshair {
        position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
        margin: -2px 0 0 -2px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      }
      #stats {
        position: absolute; left: 12px; top: 10px;
        font-size: 11px; line-height: 1.7; opacity: 0.5; white-space: pre;
      }
      #message {
        position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
        max-width: 70%; text-align: center;
        font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #f2e9c9; text-shadow: 0 0 10px #000, 0 0 3px #000;
        opacity: 0; transition: opacity 0.5s;
      }
      #message.visible { opacity: 1; }
      #hint {
        position: absolute; right: 12px; bottom: 10px;
        font-size: 11px; opacity: 0.35;
      }
      #map {
        position: absolute; right: 14px; bottom: 34px;
        width: 200px; height: 200px;
        background: rgba(0, 0, 0, 0.72); border: 1px solid rgba(242, 233, 201, 0.25);
        display: none;
      }
      #map.visible { display: block; }
      #fatal {
        position: absolute; inset: 0; z-index: 20; display: none;
        padding: 40px; background: #100; color: #f0a; white-space: pre-wrap;
        font-size: 13px; line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="stats"></div>
      <div id="message"></div>
      <canvas id="map" width="200" height="200"></canvas>
      <div id="hint">T — quality · M — map · B — glow · click/E — interact</div>
    </div>

    <div id="overlay">
      <h1>liminal</h1>
      <p>
        click to enter<br />
        WASD move · mouse look · shift run · space jump<br />
        click / E to interact · T quality · M map
      </p>
    </div>

    <div id="fatal"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
