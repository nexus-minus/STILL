<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>STILL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        color: #d8d4c4;
      }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      #overlay {
        position: absolute; inset: 0; z-index: 10; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; text-align: center; background: rgba(0, 0, 0, 0.74);
      }
      #overlay h1 {
        font-size: 20px; font-weight: 400; letter-spacing: 0.6em;
        text-transform: uppercase; color: #f2e9c9; text-indent: 0.6em;
      }
      #overlay p { font-size: 12.5px; line-height: 1.9; opacity: 0.65; }
      #overlay a { color: #9dffe0; opacity: 0.85; font-size: 12px; }
      #overlay.hidden { display: none; }

      #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      /* opt-in overlays (Settings → Overlays / ?dev=1) start hidden */
      #hud .hidden { display: none; }
      #crosshair {
        position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
        margin: -2px 0 0 -2px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      }
      #stats {
        position: absolute; left: 12px; top: 10px;
        font-size: 11px; line-height: 1.7; opacity: 0.5; white-space: pre;
      }
      /* player-facing performance line (fps + frozen) — Settings → Overlays */
      #perf {
        position: absolute; left: 12px; bottom: 10px;
        font-size: 12px; letter-spacing: 0.06em; opacity: 0.55; white-space: nowrap;
      }
      #driver {
        position: absolute; left: 12px; top: 42px;
        max-width: 70%; font-size: 10px; opacity: 0.3;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #message {
        position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
        max-width: 70%; text-align: center;
        font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #f2e9c9; text-shadow: 0 0 10px #000, 0 0 3px #000;
        opacity: 0; transition: opacity 0.5s;
      }
      #message.visible { opacity: 1; }
      #hint {
        position: absolute; right: 12px; bottom: 10px;
        font-size: 11px; opacity: 0.35;
      }
      #map {
        position: absolute; right: 14px; bottom: 34px;
        width: 200px; height: 200px;
        background: rgba(0, 0, 0, 0.72); border: 1px solid rgba(242, 233, 201, 0.25);
        display: none;
      }
      #map.visible { display: block; }
      #fatal {
        position: absolute; inset: 0; z-index: 20; display: none;
        padding: 40px; background: #100; color: #f0a; white-space: pre-wrap;
        font-size: 13px; line-height: 1.6;
      }

      /* ---- settings menu ---- */
      #settings {
        position: absolute; inset: 0; z-index: 15;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.82);
      }
      #settings.hidden { display: none; }
      #settings .panel {
        width: min(760px, 92vw); max-height: 88vh; overflow-y: auto;
        background: #141310; border: 1px solid rgba(242, 233, 201, 0.22);
        padding: 22px 26px; position: relative;
      }
      #settings h2 {
        font-weight: 400; font-size: 16px; letter-spacing: 0.45em;
        text-transform: uppercase; color: #f2e9c9; margin-bottom: 18px;
      }
      #settings h3 {
        font-weight: 400; font-size: 12px; letter-spacing: 0.25em;
        text-transform: uppercase; opacity: 0.55; margin: 4px 0 10px;
      }
      #settings .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      @media (max-width: 640px) { #settings .cols { grid-template-columns: 1fr; } }
      #settings .row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 10px; font-size: 13px;
      }
      #settings .row span { opacity: 0.85; }
      #settings .row em { font-style: normal; opacity: 0.6; margin-left: 6px; }
      #settings .row.disabled { opacity: 0.4; }
      #settings .row.check { justify-content: flex-start; }
      #settings input[type='range'] { width: 46%; accent-color: #f2e9c9; }
      #settings select {
        background: #0c0b09; color: #d8d4c4; border: 1px solid rgba(242, 233, 201, 0.3);
        padding: 4px 8px; font: inherit;
      }
      #settings .binds { margin: 8px 0; }
      #settings .bind-row {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 13px; padding: 3px 0;
      }
      #settings .bind-row button {
        min-width: 92px; text-align: center;
        background: #0c0b09; color: #d8d4c4;
        border: 1px solid rgba(242, 233, 201, 0.3);
        padding: 3px 8px; font: inherit; cursor: pointer;
      }
      #settings .bind-row button.capturing {
        border-color: #f2e9c9; color: #f2e9c9;
        animation: pulse 1s infinite alternate;
      }
      @keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }
      #settings .actions { display: flex; justify-content: flex-end; margin-top: 18px; gap: 10px; }
      #settings button {
        background: #0c0b09; color: #d8d4c4; font: inherit; cursor: pointer;
        border: 1px solid rgba(242, 233, 201, 0.3); padding: 7px 18px;
      }
      #settings button:hover { border-color: #f2e9c9; color: #f2e9c9; }
      #settings button.ghost { padding: 4px 10px; font-size: 12px; opacity: 0.7; }
      #set-resume { border-color: #f2e9c9; }
      #settings .note {
        position: absolute; left: 26px; bottom: 24px;
        font-size: 12px; color: #9dffe0; max-width: 55%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="stats" class="hidden"></div>
      <div id="driver" class="hidden"></div>
      <div id="perf" class="hidden"></div>
      <div id="message"></div>
      <canvas id="map" width="200" height="200"></canvas>
      <div id="hint" class="hidden">Esc — settings · F — freecam · F2 — screenshot · T — quality · M — map · B — glow · E — interact</div>
    </div>

    <div id="overlay">
      <h1>STILL</h1>
      <p>
        click to enter<br />
        WASD move · mouse look · shift run · space jump<br />
        E to interact · T quality · M map · Esc settings
      </p>
      <a href="./pathtrace.html">experimental area-light path-tracing comparison</a>
    </div>

    <div id="fatal"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
